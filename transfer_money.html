<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Money </title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: white;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    text-align: center;
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
    background: #1e1e1e;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }

  .header .title {
    font-size: 24px;
  }

  .header .close {
    font-size: 24px;
    cursor: pointer;
  }

  .progress {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 50px;
  }

  .progress .dot {
    height: 20px;
    width: 20px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
  }

  .progress .active {
    background-color: #4caf50;
  }

  .transfer-methods {
    margin-bottom: 20px;
  }

  .transfer-method {
    background-color: #333;
    color: white;
    width: 100%;
    padding: 20px;
    margin-bottom: 10px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: background-color 0.3s;
    border: 0;
    font: inherit;
    text-decoration: none;
    box-sizing: border-box;
  }

  .transfer-method:hover {
    background-color: #4caf50;
  }

  .transfer-method img {
    height: 24px;
    width: 24px;
    margin-right: 10px;
  }

  @media (max-width: 600px) {
    .container {
      width: 90%;
    }
  }

  .modal {
    display: none;
    position: fixed;
    z-index: 10;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.72);
    padding: 24px;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
  }
  
  .modal-content {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: #242424;
    border: 1px solid #3f3f3f;
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: 36px 28px 30px;
    text-align: center;
  }

  .modal-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    background: rgba(76, 175, 80, 0.14);
    color: #7bd87f;
    font-size: 24px;
    font-weight: 700;
  }

  .modal-content h3 {
    margin: 0 0 10px;
    font-size: 22px;
    line-height: 1.25;
  }

  .modal-content p {
    margin: 0;
    color: #cfcfcf;
    font-size: 16px;
    line-height: 1.5;
  }
  
  .close,
  .modal-close {
    color: #aaa;
    font-weight: bold;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: 0;
    background: transparent;
    padding: 4px;
    font-size: 28px;
    line-height: 1;
    cursor: pointer;
  }
  
  .close:hover,
  .close:focus,
  .modal-close:hover,
  .modal-close:focus {
    color: white;
    cursor: pointer;
  }
  
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="title">ALMERIA</span>
    <a href="login.html"><span class="close">&times;</span></a>
  </div>

  <div class="progress">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <h2>Select a transfer method</h2>

  <div class="transfer-methods">
    <a class="transfer-method" href="make_transfer.html">
      <span>Bank transfer</span>
      <span>&rarr;</span>
    </a>
    <button class="transfer-method" id="paymentLink" type="button">
      <span>Payment link</span>
      <span>&rarr;</span>
    </button>
    <!-- <div class="transfer-method">
      <span>Wire</span>
      <span>&rarr;</span>
    </div> -->
  </div>

  <!-- The Modal -->
<div id="myModal" class="modal">
  <!-- Modal content -->
  <div class="modal-content">
    <button class="modal-close" type="button" aria-label="Close">&times;</button>
    <span class="modal-icon">!</span>
    <h3>Payment link unavailable</h3>
    <p>Service is not currently available for your region.</p>
  </div>
</div>
</div>

<script>
  // Get the modal
var modal = document.getElementById("myModal");

// Get the button that opens the modal
var btnPaymentLink = document.getElementById("paymentLink");

// Get the <span> element that closes the modal
var modalClose = document.getElementsByClassName("modal-close")[0];

// When the user clicks on the button, open the modal
btnPaymentLink.onclick = function() {
  modal.style.display = "flex";
}

// When the user clicks on <span> (x), close the modal
modalClose.onclick = function() {
  modal.style.display = "none";
}

// When the user clicks anywhere outside of the modal, close it
window.onclick = function(event) {
  if (event.target == modal) {
    modal.style.display = "none";
  }
}

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    modal.style.display = "none";
  }
});

</script>

</body>
</html>
